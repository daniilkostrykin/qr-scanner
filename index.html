<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #000);
      color: var(--tg-theme-text-color, #fff);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div>Открываем камеру...</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    tg.showScanQrPopup({ text: "Наведите камеру на QR-код чека" }, function(qrText) {
      if (qrText) {
        tg.sendData(qrText);
        tg.close();
        return true;
      }
      return false;
    });
  </script>
</body>
</html>
