<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сканер чеков</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #1a1a1a);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div>Запуск камеры...</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    tg.onEvent('scanQrPopupClosed', function() {
      tg.close();
    });

    tg.showScanQrPopup({ text: "Наведите камеру на QR-код внизу чека" }, function(qrText) {
      if (qrText) {
        tg.closeScanQrPopup();
        tg.sendData(qrText);
        tg.close();
        return true;
      }
      return false;
    });
  </script>
</body>
</html>
