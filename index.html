<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сканер чеков</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #1a1a1a);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div>Камера запускается...</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    tg.onEvent('scanQrPopupClosed', function() {
      tg.close();
    });

    tg.showScanQrPopup({ text: "Наведите на фискальный QR-код чека (t=...&fn=...)" }, function(qrText) {
      if (!qrText) return false;

      const isReceipt = qrText.includes("t=") && qrText.includes("fn=");

      if (isReceipt) {
        if (tg.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }
        tg.sendData(qrText);
        tg.close();
        return true; 
      } else {

        if (tg.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('error');
        }
        return false; 
      }
    });
  </script>
</body>
</html>
