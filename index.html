<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сканер чеков</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #1a1a1a);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div>Камера запускается...</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let scannedData = null;
    let isHandled = false;

    function haptic(type) {
      try {
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type);
      } catch (e) {}
    }

    // Единая точка завершения: sendData + close.
    // Защита от гонки: событие scanQrPopupClosed и страховый setTimeout
    // могут сработать оба — выполнять отправку нужно ровно один раз.
    function finishAndSend() {
      if (isHandled) return;
      isHandled = true;

      if (scannedData) {
        try { tg.sendData(scannedData); } catch (e) {}
      }
      try { tg.close(); } catch (e) {}
    }

    // Штатное нативное закрытие видоискателя (крестик или после return true)
    tg.onEvent('scanQrPopupClosed', function() {
      finishAndSend();
    });

    // Запуск нативного сканера Telegram
    tg.showScanQrPopup({ text: "Наведите на фискальный QR-код чека (t=...&fn=...)" }, function(qrText) {
      if (isHandled) return true;

      // Фискальный чек обязан содержать параметры t= и fn=
      const isReceipt = typeof qrText === 'string' && qrText.includes('t=') && qrText.includes('fn=');

      if (!isReceipt) {
        // Чужой QR (СБП, реклама): вибро-ошибка, камера продолжает сканирование
        haptic('error');
        return false;
      }

      // Валидный чек: вибро-успех, сохраняем строку, отдаём закрытие камеры клиенту Telegram
      haptic('success');
      scannedData = qrText;

      // Страховка: если клиент Telegram задержит событие scanQrPopupClosed
      setTimeout(finishAndSend, 350);

      return true; // запускает штатную нативную анимацию закрытия камеры
    });
  </script>
</body>
</html>
