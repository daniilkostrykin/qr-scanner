<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Чеки</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--tg-theme-bg-color, #121212);
      color: var(--tg-theme-text-color, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--tg-theme-bg-color, #121212);
      padding: calc(env(safe-area-inset-top) + 10px) 12px 8px;
      border-bottom: 1px solid var(--tg-theme-hint-color, rgba(255,255,255,.12));
    }
    .search {
      width: 100%; border: 0; outline: 0;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      color: var(--tg-theme-text-color, #ffffff);
      border-radius: 10px; padding: 10px 14px; font-size: 15px;
    }
    .search::placeholder { color: var(--tg-theme-hint-color, #8e8e93); }
    .chips { display: flex; gap: 8px; margin-top: 8px; }
    .chip {
      border: 0; border-radius: 16px; padding: 6px 12px; font-size: 13px;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      color: var(--tg-theme-text-color, #ffffff);
      opacity: .6; cursor: pointer; transition: opacity .15s;
    }
    .chip.active {
      opacity: 1;
      background: var(--tg-theme-button-color, #3b82f6);
      color: var(--tg-theme-button-text-color, #ffffff);
    }
    #status { font-size: 12px; color: var(--tg-theme-hint-color, #8e8e93); padding: 6px 14px 0; min-height: 18px; }
    .card {
      margin: 8px 12px; border-radius: 12px; overflow: hidden;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e);
    }
    .card-head { padding: 12px 14px; cursor: pointer; }
    .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .store {
      font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1; min-width: 0; margin-right: 6px;
    }
    .rename-btn {
      flex: none; border: 0; background: transparent; cursor: pointer;
      font-size: 12px; padding: 2px 4px; opacity: .55;
    }
    .rename-btn:active { transform: scale(.9); }
    .sum { font-weight: 700; font-size: 15px; white-space: nowrap; }
    .row2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .date { font-size: 12px; color: var(--tg-theme-hint-color, #8e8e93); }
    .badge {
      font-size: 11px; padding: 2px 8px; border-radius: 10px;
      border: 0; cursor: pointer; font-family: inherit;
      transition: opacity .15s, transform .1s;
    }
    .badge:hover { opacity: .8; }
    .badge:active { transform: scale(.93); }
    .badge.PERSONAL { background: rgba(16,185,129,.18); color: #10b981; }
    .badge.FAMILY { background: rgba(59,130,246,.18); color: #3b82f6; }
    .badge.SPLIT { background: rgba(245,158,11,.18); color: #f59e0b; }
    .cat-toggle {
      flex: none; border: 0; cursor: pointer;
      border-radius: 10px; padding: 2px 9px; font-size: 13px; line-height: 1.5;
      background: rgba(16,185,129,.18); color: #10b981;
    }
    .cat-toggle.FAMILY { background: rgba(59,130,246,.18); color: #3b82f6; }
    .count { margin-left: auto; font-size: 12px; color: var(--tg-theme-hint-color, #8e8e93); }
    .items { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
    .card.open .items { max-height: 800px; }
    .item {
      display: flex; gap: 10px; justify-content: space-between;
      padding: 8px 14px; font-size: 13px;
      border-top: 1px solid var(--tg-theme-hint-color, rgba(255,255,255,.08));
    }
    .item .name { flex: 1; }
    .item .qty { color: var(--tg-theme-hint-color, #8e8e93); font-size: 12px; white-space: nowrap; }
    .fab {
      position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
      width: 56px; height: 56px; border: 0; border-radius: 50%; cursor: pointer;
      background: var(--tg-theme-button-color, #3b82f6);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 24px; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }
    .empty { text-align: center; color: var(--tg-theme-hint-color, #8e8e93); padding: 48px 20px; font-size: 14px; }
    .cashback-chip {
      flex: none; border: 0; cursor: pointer;
      border-radius: 10px; padding: 2px 8px; font-size: 12px; line-height: 1.5;
      background: rgba(245,158,11,.16); color: #f59e0b;
    }
    .cashback-chip:not(.on) { background: transparent; color: var(--tg-theme-hint-color, #8e8e93); opacity: .5; }
    .cashback-chip:active { transform: scale(.93); }
    .old-sum { text-decoration: line-through; color: var(--tg-theme-hint-color, #8e8e93); }
    .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; z-index: 20; }
    .sheet[hidden] { display: none; }
    .sheet-card {
      width: 100%; padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
      background: var(--tg-theme-bg-color, #121212);
      border-radius: 14px 14px 0 0;
    }
    .sheet-title { font-weight: 600; font-size: 15px; }
    .sheet-sub {
      font-size: 12px; color: var(--tg-theme-hint-color, #8e8e93); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sheet-presets { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    .preset {
      border: 0; cursor: pointer; border-radius: 12px; padding: 8px 14px; font-size: 14px;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e); color: var(--tg-theme-text-color, #ffffff);
    }
    .preset:active { transform: scale(.95); }
    .sheet-custom { display: flex; gap: 8px; margin-bottom: 10px; }
    .sheet-input {
      flex: 1; border: 0; outline: 0; border-radius: 10px; padding: 10px 12px; font-size: 15px;
      background: var(--tg-theme-secondary-bg-color, #1c1c1e); color: var(--tg-theme-text-color, #ffffff);
    }
    .sheet-btn {
      border: 0; cursor: pointer; border-radius: 10px; padding: 10px 16px; font-size: 14px;
      background: var(--tg-theme-button-color, #3b82f6); color: var(--tg-theme-button-text-color, #ffffff);
    }
    .sheet-btn.ghost {
      width: 100%; background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      color: var(--tg-theme-text-color, #ffffff);
    }
    .sheet-btn.inline {
      padding: 10px 14px; background: var(--tg-theme-secondary-bg-color, #1c1c1e);
      color: var(--tg-theme-text-color, #ffffff);
    }
  </style>
</head>
<body>
  <header>
    <input id="search" class="search" type="search" placeholder="Поиск по магазину и товарам" autocomplete="off">
    <div class="chips">
      <button class="chip active" data-filter="all">Все</button>
      <button class="chip" data-filter="PERSONAL">👤 Личные</button>
      <button class="chip" data-filter="FAMILY">👥 Семья</button>
    </div>
  </header>
  <div id="status"></div>
  <main id="list"></main>
  <button id="fab" class="fab" aria-label="Сканировать чек">📷</button>

  <div id="cbSheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-label="Кэшбэк позиции">
      <div class="sheet-title">🪙 Кэшбэк позиции</div>
      <div id="cbName" class="sheet-sub"></div>
      <div id="cbPresets" class="sheet-presets"></div>
      <div class="sheet-custom">
        <input id="cbInput" class="sheet-input" type="number" min="0" max="100" inputmode="numeric" placeholder="0–100">
        <button type="button" id="cbApply" class="sheet-btn">OK</button>
      </div>
      <button type="button" id="cbCancel" class="sheet-btn ghost">Отмена</button>
    </div>
  </div>

  <div id="rnSheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-label="Переименовать магазин">
      <div class="sheet-title">✏️ Переименовать магазин</div>
      <div id="rnRaw" class="sheet-sub"></div>
      <div class="sheet-custom">
        <input id="rnInput" class="sheet-input" type="text" maxlength="50" placeholder="Новое название" autocomplete="off">
        <button type="button" id="rnClear" class="sheet-btn inline" aria-label="Очистить поле">✕</button>
      </div>
      <button type="button" id="rnApply" class="sheet-btn">Сохранить</button>
      <button type="button" id="rnCancel" class="sheet-btn ghost">Отмена</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Адрес HTTP API бэкенда (api/server.py). Для продакшена — публичный туннель/домен.
    const API_BASE_URL = "https://checker-bot-qt2t.onrender.com";
    const CACHE_KEY = "cached_receipts";

    let receipts = [];
    let activeFilter = "all";
    let query = "";
    const expanded = new Set();

    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");

    function money(kopecks) {
      return (kopecks / 100).toFixed(2) + " ₽";
    }

    function formatDate(value) {
      if (!value) return "";
      const raw = String(value).trim();
      let d = new Date(/^[0-9T:\- ]+$/.test(raw) ? raw.replace(" ", "T") : raw);
      if (isNaN(d) && /^\d+$/.test(raw)) {
        // запасной путь: unix timestamp (мс либо секунды)
        const n = Number(raw);
        d = new Date(n >= 1e11 ? n : n * 1000);
      }
      if (isNaN(d)) return raw;
      return d.toLocaleString("ru-RU", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit",
      });
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function visibleReceipts() {
      const q = query.trim().toLowerCase();
      return receipts.filter((r) => {
        if (activeFilter !== "all" && r.category !== activeFilter) return false;
        if (!q) return true;
        if (String(r.store || "").toLowerCase().includes(q)) return true;
        return (r.items || []).some((it) =>
          String(it.name || "").toLowerCase().includes(q)
        );
      });
    }

    function render() {
      const list = visibleReceipts();
      if (!list.length) {
        listEl.innerHTML =
          '<div class="empty">' +
          (receipts.length ? "Ничего не найдено" : "Чеков пока нет") +
          "</div>";
        return;
      }
      listEl.innerHTML = list.map((r) => {
        const items = (r.items || []).map((it) => {
          const cb = it.cashback_percent || 0;
          const eff = Math.round((it.sum * (100 - cb)) / 100); // как на бэкенде: половина вверх
          return (
            '<div class="item">' +
              '<span class="name">' + esc(it.name) + "</span>" +
              '<span class="qty">' + it.quantity + " × " + money(it.price) + "</span>" +
              (it.id
                ? '<button type="button" class="cat-toggle ' + it.expense_type + '"' +
                  ' data-receipt="' + r.id + '" data-item="' + it.id + '"' +
                  ' aria-label="Сменить категорию позиции">' +
                  (it.expense_type === "FAMILY" ? "👥" : "👤") + "</button>" +
                  '<button type="button" class="cashback-chip' + (cb > 0 ? " on" : "") + '"' +
                  ' data-receipt="' + r.id + '" data-item="' + it.id + '"' +
                  ' aria-label="Кэшбэк позиции">' +
                  (cb > 0 ? "🏷️ -" + cb + "%" : "🪙") + "</button>"
                : "") +
              "<span>" +
                (cb > 0
                  ? '<s class="old-sum">' + money(it.sum) + "</s> " + money(eff)
                  : money(it.sum)) +
              "</span>" +
            "</div>"
          );
        }).join("");
        const badgeLabel = r.category === "FAMILY" ? "👥 Семья"
          : r.category === "SPLIT" ? "↔️ Разделён" : "👤 Личные";
        const badgeClass = r.category === "FAMILY" ? "FAMILY"
          : r.category === "SPLIT" ? "SPLIT" : "PERSONAL";
        const badge =
          '<button type="button" class="badge ' + badgeClass + '" data-receipt="' + r.id + '"' +
          ' aria-label="Сменить категорию чека (Личные/Семья)">' + badgeLabel + "</button>";
        return (
          '<div class="card' + (expanded.has(r.id) ? " open" : "") + '" data-id="' + r.id + '">' +
            '<div class="card-head">' +
              '<div class="row1">' +
                '<div class="store">' + esc(r.store) + "</div>" +
                '<button type="button" class="rename-btn" data-receipt="' + r.id + '"' +
                ' aria-label="Переименовать магазин">✏️</button>' +
                '<div class="sum">' + money(r.total_sum) + "</div>" +
              "</div>" +
              '<div class="row2">' +
                '<span class="date">' + esc(formatDate(r.date_time)) + "</span>" +
                badge +
                '<span class="count">' + r.items_count + " поз.</span>" +
              "</div>" +
            "</div>" +
            '<div class="items">' + items + "</div>" +
          "</div>"
        );
      }).join("");
    }

    async function fetchReceipts() {
      if (!tg.initData) {
        statusEl.textContent =
          "Откройте приложение через кнопку в боте — история доступна только внутри Telegram";
        return;
      }
      try {
        const resp = await fetch(API_BASE_URL + "/api/receipts", {
          headers: { Authorization: "Bearer " + tg.initData },
        });
        if (resp.status === 401) {
          statusEl.textContent = "Сессия устарела — закройте и откройте приложение заново";
          return;
        }
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        receipts = await resp.json();
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(receipts)); } catch (e) {}
        statusEl.textContent = "";
      } catch (e) {
        statusEl.textContent = receipts.length
          ? "Не удалось обновить — показаны сохранённые данные"
          : "Не удалось загрузить данные";
      }
      render();
    }

    // Раскрытие карточки, переключение категории чека и позиции
    listEl.addEventListener("click", (e) => {
      const rnBtn = e.target.closest(".rename-btn");
      if (rnBtn) {
        e.stopPropagation(); // клик по карандашу не сворачивает/разворачивает карточку
        openRenameSheet(Number(rnBtn.dataset.receipt));
        return;
      }
      const catBadge = e.target.closest(".badge");
      if (catBadge) {
        e.stopPropagation(); // клик по бейджу не сворачивает/разворачивает карточку
        toggleReceiptCategory(Number(catBadge.dataset.receipt));
        return;
      }
      const toggle = e.target.closest(".cat-toggle");
      if (toggle) {
        e.stopPropagation();
        toggleItemCategory(Number(toggle.dataset.receipt), Number(toggle.dataset.item));
        return;
      }
      const cbChip = e.target.closest(".cashback-chip");
      if (cbChip) {
        e.stopPropagation(); // клик по чипу не сворачивает/разворачивает карточку
        openCashbackSheet(Number(cbChip.dataset.receipt), Number(cbChip.dataset.item));
        return;
      }
      const head = e.target.closest(".card-head");
      if (!head) return;
      const card = head.parentElement;
      const id = Number(card.dataset.id);
      card.classList.toggle("open");
      if (expanded.has(id)) expanded.delete(id);
      else expanded.add(id);
    });

    // ---------- Переключение категории позиции (Личные/Семья) ----------
    function deriveCategory(items) {
      const types = new Set((items || []).map((it) => it.expense_type));
      if (!types.size) return "PERSONAL";
      return types.size === 1 ? Array.from(types)[0] : "SPLIT";
    }

    async function toggleItemCategory(receiptId, itemId) {
      const receipt = receipts.find((r) => r.id === receiptId);
      const item = receipt && (receipt.items || []).find((it) => it.id === itemId);
      if (!item) return;
      if (!tg.initData) {
        statusEl.textContent =
          "Нет данных Telegram — обновите чат и откройте приложение заново через меню";
        return;
      }

      const prevType = item.expense_type;
      const prevCategory = receipt.category;
      const newType = prevType === "PERSONAL" ? "FAMILY" : "PERSONAL";

      // Оптимистичное обновление интерфейса
      item.expense_type = newType;
      receipt.category = deriveCategory(receipt.items);
      try { if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); } catch (e) {}
      render();

      try {
        const resp = await fetch(API_BASE_URL + "/api/items/" + itemId, {
          method: "PATCH",
          headers: {
            "Authorization": "Bearer " + tg.initData,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ expense_type: newType })
        });
        if (!resp.ok) throw new Error(resp.status === 401
          ? "Сессия устарела — закройте и откройте приложение заново"
          : "HTTP " + resp.status);
        const data = await resp.json().catch(() => ({}));
        // Категория чека с сервера — источник истины (PERSONAL/FAMILY/SPLIT)
        if (data.expense_type) item.expense_type = data.expense_type;
        if (data.receipt_category) receipt.category = data.receipt_category;
        render();
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(receipts)); } catch (e) {}
      } catch (e) {
        // Откат при сетевой/серверной ошибке
        item.expense_type = prevType;
        receipt.category = prevCategory;
        render();
        try { if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error"); } catch (err) {}
        statusEl.textContent = "❌ " + ((e && e.message) || "Не удалось изменить категорию позиции");
      }
    }

    // ---------- Переключение категории всего чека (Личные/Семья) ----------
    async function toggleReceiptCategory(receiptId) {
      const receipt = receipts.find((r) => r.id === receiptId);
      if (!receipt) return;
      if (!tg.initData) {
        statusEl.textContent =
          "Нет данных Telegram — обновите чат и откройте приложение заново через меню";
        return;
      }

      const prevCategory = receipt.category;
      const prevTypes = (receipt.items || []).map((it) => it.expense_type);
      // PERSONAL или SPLIT -> FAMILY, FAMILY -> PERSONAL
      const newType = prevCategory === "FAMILY" ? "PERSONAL" : "FAMILY";

      // Оптимистичное обновление UI: бейдж чека и все позиции внутри карточки
      receipt.category = newType;
      (receipt.items || []).forEach((it) => { it.expense_type = newType; });
      try { if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); } catch (e) {}
      render();

      try {
        const resp = await fetch(API_BASE_URL + "/api/receipts/" + receiptId + "/category", {
          method: "PATCH",
          headers: {
            "Authorization": "Bearer " + tg.initData,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ expense_type: newType })
        });
        if (!resp.ok) throw new Error(resp.status === 401
          ? "Сессия устарела — закройте и откройте приложение заново"
          : "HTTP " + resp.status);
        const data = await resp.json().catch(() => ({}));
        if (data.category) receipt.category = data.category;
        render();
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(receipts)); } catch (e) {}
      } catch (e) {
        // Откат при сетевой/серверной ошибке
        receipt.category = prevCategory;
        (receipt.items || []).forEach((it, i) => { it.expense_type = prevTypes[i]; });
        render();
        try { if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error"); } catch (err) {}
        statusEl.textContent = "❌ " + ((e && e.message) || "Не удалось изменить категорию чека");
      }
    }

    // ---------- Кэшбэк позиции (шторка с пресетами) ----------
    let cbTarget = null; // {receiptId, itemId} — позиция, для которой открыта шторка
    const cbSheet = document.getElementById("cbSheet");

    function openCashbackSheet(receiptId, itemId) {
      const receipt = receipts.find((r) => r.id === receiptId);
      const item = receipt && (receipt.items || []).find((it) => it.id === itemId);
      if (!item) return;
      cbTarget = { receiptId, itemId };
      document.getElementById("cbName").textContent = item.name;
      document.getElementById("cbInput").value = String(item.cashback_percent || 0);
      document.getElementById("cbPresets").innerHTML = [0, 5, 10, 20, 50]
        .map((p) => '<button type="button" class="preset" data-pct="' + p + '">' + p + "%</button>")
        .join("");
      cbSheet.hidden = false;
    }

    function closeCashbackSheet() {
      cbSheet.hidden = true;
      cbTarget = null;
    }

    async function setItemCashback(receiptId, itemId, percent) {
      const receipt = receipts.find((r) => r.id === receiptId);
      const item = receipt && (receipt.items || []).find((it) => it.id === itemId);
      if (!item) return;
      if (!tg.initData) {
        statusEl.textContent =
          "Нет данных Telegram — обновите чат и откройте приложение заново через меню";
        return;
      }
      const prev = item.cashback_percent || 0;
      item.cashback_percent = percent; // оптимистичное обновление строки товара
      render();
      try {
        const resp = await fetch(API_BASE_URL + "/api/items/" + itemId, {
          method: "PATCH",
          headers: {
            "Authorization": "Bearer " + tg.initData,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ cashback_percent: percent })
        });
        if (!resp.ok) throw new Error(resp.status === 401
          ? "Сессия устарела — закройте и откройте приложение заново"
          : "HTTP " + resp.status);
        const data = await resp.json().catch(() => ({}));
        if (typeof data.cashback_percent === "number") item.cashback_percent = data.cashback_percent;
        render();
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(receipts)); } catch (e) {}
        try { if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      } catch (e) {
        item.cashback_percent = prev; // откат при ошибке
        render();
        try { if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error"); } catch (err) {}
        statusEl.textContent = "❌ " + ((e && e.message) || "Не удалось изменить кэшбэк");
      }
    }

    document.getElementById("cbPresets").addEventListener("click", (e) => {
      const btn = e.target.closest(".preset");
      if (!btn || !cbTarget) return;
      setItemCashback(cbTarget.receiptId, cbTarget.itemId, Number(btn.dataset.pct));
      closeCashbackSheet();
    });
    document.getElementById("cbApply").addEventListener("click", () => {
      if (!cbTarget) return;
      const v = parseInt(document.getElementById("cbInput").value, 10);
      if (isNaN(v) || v < 0 || v > 100) {
        statusEl.textContent = "❌ Кэшбэк должен быть целым числом от 0 до 100";
        return;
      }
      setItemCashback(cbTarget.receiptId, cbTarget.itemId, v);
      closeCashbackSheet();
    });
    document.getElementById("cbCancel").addEventListener("click", closeCashbackSheet);
    cbSheet.addEventListener("click", (e) => {
      if (e.target === cbSheet) closeCashbackSheet(); // клик по подложке
    });

    // ---------- Переименование магазина (алиас) ----------
    let rnTarget = null; // {receiptId} — чек, для которого открыта шторка
    const rnSheet = document.getElementById("rnSheet");

    function openRenameSheet(receiptId) {
      const receipt = receipts.find((r) => r.id === receiptId);
      if (!receipt) return;
      rnTarget = { receiptId };
      document.getElementById("rnRaw").textContent = receipt.raw_store || receipt.store || "";
      document.getElementById("rnInput").value = receipt.store || "";
      rnSheet.hidden = false;
      document.getElementById("rnInput").focus();
    }

    function closeRenameSheet() {
      rnSheet.hidden = true;
      rnTarget = null;
    }

    async function renameStore(receiptId, newName) {
      const receipt = receipts.find((r) => r.id === receiptId);
      if (!receipt) return;
      const rawName = receipt.raw_store || receipt.store;
      if (!rawName) return;
      if (!tg.initData) {
        statusEl.textContent =
          "Нет данных Telegram — обновите чат и откройте приложение заново через меню";
        return;
      }
      const trimmed = (newName || "").trim();
      if (trimmed.length > 50) {
        statusEl.textContent = "❌ Название не длиннее 50 символов";
        return;
      }

      // Оптимистично: у ВСЕХ чеков с таким же raw_store меняем отображаемое имя
      const prevStores = new Map();
      receipts.forEach((r) => {
        if ((r.raw_store || r.store) === rawName) {
          prevStores.set(r.id, r.store);
          r.store = trimmed || rawName;
        }
      });
      render();
      try {
        const resp = await fetch(API_BASE_URL + "/api/stores/alias", {
          method: "PUT",
          headers: {
            "Authorization": "Bearer " + tg.initData,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ raw_name: rawName, display_name: trimmed })
        });
        if (!resp.ok) throw new Error(resp.status === 401
          ? "Сессия устарела — закройте и откройте приложение заново"
          : "HTTP " + resp.status);
        const data = await resp.json().catch(() => ({}));
        const finalName = data.display_name || trimmed || rawName;
        receipts.forEach((r) => {
          if ((r.raw_store || r.store) === rawName) r.store = finalName;
        });
        render();
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(receipts)); } catch (e) {}
        try { if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      } catch (e) {
        // Откат: возвращаем прежние названия
        receipts.forEach((r) => { if (prevStores.has(r.id)) r.store = prevStores.get(r.id); });
        render();
        try { if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error"); } catch (err) {}
        statusEl.textContent = "❌ " + ((e && e.message) || "Не удалось переименовать магазин");
      }
    }

    document.getElementById("rnApply").addEventListener("click", () => {
      if (!rnTarget) return;
      const v = document.getElementById("rnInput").value;
      renameStore(rnTarget.receiptId, v);
      closeRenameSheet();
    });
    document.getElementById("rnClear").addEventListener("click", () => {
      document.getElementById("rnInput").value = "";
      document.getElementById("rnInput").focus();
    });
    document.getElementById("rnCancel").addEventListener("click", closeRenameSheet);
    rnSheet.addEventListener("click", (e) => {
      if (e.target === rnSheet) closeRenameSheet(); // клик по подложке
    });

    // Поиск в реальном времени (дебаунс 120 мс)
    let searchTimer = null;
    document.getElementById("search").addEventListener("input", (e) => {
      query = e.target.value;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(render, 120);
    });

    // Чипы-фильтры категорий
    document.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        render();
      });
    });

    // Обновление данных при возврате во вкладку
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) fetchReceipts();
    });

    // ---------- Нативный сканер: сохранение чека напрямую на бэкенде ----------
    // tg.sendData() блокируется при открытии Mini App через системное меню,
    // поэтому чек сохраняется через POST /api/receipts/scan (Bearer initData).
    let scannedData = null;
    let saveInProgress = false;
    let scanHandled = false;

    function haptic(type) {
      try {
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type);
      } catch (e) {}
    }

    async function saveScannedReceipt() {
      if (saveInProgress) return;
      if (!tg.initData) {
        haptic("error");
        statusEl.textContent =
          "Нет данных Telegram — обновите чат и откройте приложение заново через меню";
        return;
      }
      saveInProgress = true;
      statusEl.textContent = "Сохраняю чек из ФНС...";
      try {
        const resp = await fetch(API_BASE_URL + "/api/receipts/scan", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + tg.initData,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ qr: scannedData })
        });

        if (resp.status === 201) {
          haptic("success");
          await fetchReceipts(); // перезагрузка списка чеков
          statusEl.textContent = "";
          try { if (tg.closeScanQrPopup) tg.closeScanQrPopup(); } catch (e) {}
          return;
        }

        let data = {};
        try { data = await resp.json(); } catch (e) {}

        if (resp.status === 409) {
          haptic("warning");
          statusEl.textContent = "⚠️ Этот чек уже был добавлен ранее";
          return;
        }
        if (resp.status === 401) {
          haptic("error");
          statusEl.textContent = "Сессия устарела — закройте и откройте приложение заново";
          return;
        }
        // 422 (ошибка ФНС) и прочие ошибки — показываем detail с бэкенда
        haptic("error");
        statusEl.textContent =
          "❌ " + (data.detail || data.error || "Не удалось сохранить чек (HTTP " + resp.status + ")");
      } catch (e) {
        // Ошибка сети — detail из исключения
        haptic("error");
        statusEl.textContent = "❌ " + ((e && e.message) || "Ошибка сети при сохранении чека");
      } finally {
        saveInProgress = false;
      }
    }

    tg.onEvent("scanQrPopupClosed", function () {
      scanHandled = false; // попап закрыт (успех или отмена) — можно сканировать снова
    });

    document.getElementById("fab").addEventListener("click", function () {
      if (saveInProgress) return;
      scannedData = null;
      scanHandled = false;
      statusEl.textContent = "";
      tg.showScanQrPopup(
        { text: "Наведите на фискальный QR-код чека (t=...&fn=...)" },
        function (qrText) {
          if (scanHandled) return true;
          const isReceipt =
            typeof qrText === "string" && qrText.includes("t=") && qrText.includes("fn=");
          if (!isReceipt) {
            haptic("error");
            return false; // чужой QR — камера продолжает сканирование
          }
          scanHandled = true;
          scannedData = qrText;
          saveScannedReceipt(); // вместо tg.sendData(): прямой POST на бэкенд
          return true; // true закрывает попап камеры (документация Telegram)
        }
      );
    });

    // Кэш при старте: мгновенный рендер из localStorage, затем фоновое обновление
    try {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) receipts = JSON.parse(cached) || [];
    } catch (e) {}
    render();
    fetchReceipts();
  </script>
</body>
</html>
